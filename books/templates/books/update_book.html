
<!DOCTYPE html>
<html>
<head>
    <title>Update Book Price</title>
</head>
<body>
    <h1>Update Book Price</h1>

    <p>Book: {{ book.title }}</p>
    <p>Author: {{ book.author }}</p>
    <p>Current Price: {{ book.price }}</p>

    <form method="POST">
        {% csrf_token %}

        <label>New Price:</label>
        <input type="number" name="price"
               value="{{ book.price }}" min="0" required>

        <button type="submit">Update Price</button>
    </form>

    <br>
    <a href="{% url 'book_list' %}">Back to Book List</a>
</body>
</html>
